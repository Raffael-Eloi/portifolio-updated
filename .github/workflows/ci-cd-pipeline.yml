name: Pipeline

on:
    workflow_dispatch:
    push:
        branches: ["main"]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js environmen
              uses: actions/setup-node@v4.0.2
              with:
                  node-version: "25.2.1"

            - name: Setup project
              uses: actions/checkout@v4
            - run: |
                  npm install

    tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - run: |
                  npm install
                  npm run test
